name: UsaLiveEvent Auto Updater

on:
  schedule:
    # Berjalan otomatis setiap 3 jam
    - cron: '0 */3 * * *'
  workflow_dispatch: # Memungkinkan untuk dijalankan secara manual dari tab Actions

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run All Update Scripts
        run: |
          # Menjalankan skrip Python utama
          python awaf.py || true
          python castwebsports.py || true
          python cdntv.py || true
          python cdntv_ch.py || true
          python cdntv_ch_filter.py || true
          python centerstrm.py || true
          python nfl_webcast.py || true
          python nflwebcast.py || true
          python nhl_webcast.py || true
          python stgate.py || true
          python webtv.py || true
          python webtvmlb.py || true

      - name: Organize Outputs to UsaLiveEvent Folder
        run: |
          # Buat folder baru UsaLiveEvent jika belum ada
          mkdir -p UsaLiveEvent

          # Salin/Pindahkan file output M3U, M3U8, dan JSON ke folder UsaLiveEvent
          cp -f *.m3u UsaLiveEvent/ 2>/dev/null || true
          cp -f *.m3u8 UsaLiveEvent/ 2>/dev/null || true
          cp -f *.json UsaLiveEvent/ 2>/dev/null || true

          # Salin juga isi folder cache jika ada
          if [ -d "cache" ]; then
            mkdir -p UsaLiveEvent/cache
            cp -rf cache/* UsaLiveEvent/cache/ 2>/dev/null || true
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add UsaLiveEvent/
          
          # Lakukan commit hanya jika ada perubahan file
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Auto-update playlist files into UsaLiveEvent [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
